<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | ATM Fraud Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page auth-theme">
    <div class="auth-background" aria-hidden="true"></div>

    <main class="auth-shell auth-shell-centered">
        <section class="auth-card-panel">
            <div class="auth-card">
                <p class="auth-card-label">Welcome back</p>
                <h2>Sign in to continue</h2>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="auth-flash-stack">
                    {% for category, message in messages %}
                    <div class="flash-v2 {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <form method="POST" class="auth-form">
                    <div class="form-group">
                        <label for="identifier">Email or Username</label>
                        <input id="identifier" type="text" name="identifier" placeholder="Enter your email or username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" type="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn-primary auth-submit-btn">Login</button>
                </form>

                <p class="bottom-link">
                    Don&apos;t have an account?
                    <a href="{{ url_for('register') }}">Create one</a>
                </p>
            </div>
        </section>
    </main>
</body>

</html>
